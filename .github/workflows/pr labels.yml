name: PR Label Check

on:
  pull_request:
    types:
      - labeled
      - unlabeled
      - opened

permissions:
  pull-requests: write

jobs:
  check-label:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr    = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            // ── 1. Get current PR labels ──────────────────────────────────────
            const prLabels = pr.labels.map(l => l.name.toLowerCase());
            core.info(`Labels on PR: ${JSON.stringify(prLabels)}`);

            // ── 2. Check if bug or enhancement label is present ───────────────
            const CORE_LABELS = ['bug', 'enhancement'];
            const hasCoreLabel = prLabels.some(l => CORE_LABELS.includes(l));
            core.info(`Core label found: ${hasCoreLabel}`);

            // ── 3. Hidden marker for bot comment ──────────────────────────────
            const MARKER = `<!-- pr-label-check:${pr.number} -->`;

            // ── 4. Helpers ────────────────────────────────────────────────────

            /** Find existing bot comment on this PR */
            async function findBotComment() {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number: pr.number, per_page: 100 }
              );
              return comments.find(
                c => c.user.login === 'github-actions[bot]' &&
                     c.body.includes(MARKER)
              ) || null;
            }

            /** Post or update bot comment */
            async function upsertBotComment(body) {
              const full     = `${body}\n\n${MARKER}`;
              const existing = await findBotComment();
              if (!existing) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pr.number,
                  body: full,
                });
                core.info('Created bot comment');
              } else if (existing.body !== full) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body: full,
                });
                core.info('Updated bot comment');
              } else {
                core.info('Bot comment unchanged — skipping update');
              }
            }

            /** Delete bot comment if it exists */
            async function deleteBotComment() {
              const existing = await findBotComment();
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                });
                core.info(`Deleted bot comment ${existing.id}`);
              }
            }

            // ── 5. Reminder comment body ──────────────────────────────────────
            const REMINDER_BODY = `
            ## ⚠️ Missing: PR Classification Label

            This PR cannot be merged until either \`bug\` or \`enhancement\` label is added.

            **How to add a label:**
            > Go to the **Labels** section on the right panel of this PR → click and select a label.

            **You must add one of the following:**

            | Label | Use When |
            |---|---|
            | \`bug\` | You are fixing something that is broken |
            | \`enhancement\` | You are adding a new feature or improvement |

            > ℹ️ After adding \`bug\` or \`enhancement\`, you can also add other labels like \`high-priority\`, \`in-progress\`, \`refactor\` etc. based on your requirement.
            `;

            // ── 6. Act based on core label presence ──────────────────────────
            if (!hasCoreLabel) {
              core.info('No core label found on PR — failing check');
              await upsertBotComment(REMINDER_BODY);
              core.setFailed(
                '❌ This PR is missing a required label. ' +
                'Please add either "bug" or "enhancement" from the Labels panel.'
              );
            } else {
              core.info('Core label found on PR — check passed');
              await deleteBotComment();
              core.info('✅ PR Label Check passed');
            }
